<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>
  </defs>
  
  <!-- Icon Group -->
  <g transform="translate(10, 5)">
    <!-- House outline -->
    <path d="M 28 8 L 52 28 L 44 28 L 44 52 L 12 52 L 12 28 L 4 28 Z" fill="url(#houseGrad)" />
    <!-- Water Drop overlay -->
    <path d="M 28 14 C 28 14 40 30 40 38 C 40 44.6 34.6 50 28 50 C 21.4 50 16 44.6 16 38 C 16 30 28 14 28 14 Z" fill="url(#dropGrad)" />
    <!-- White sparkle inner -->
    <circle cx="24" cy="34" r="3" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Brand Name Text -->
  <text x="75" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="0.5">
    HOME<tspan fill="#FFB800">FUGAS</tspan>
  </text>
  <text x="76" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#E2E8F0" letter-spacing="1.5">
    VALPARAÍSO & VIÑA DEL MAR
  </text>
</svg>
